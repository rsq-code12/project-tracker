<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Project tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FBFBFA; --surface:#FFFFFF; --hover:#F6F6F4; --ink:#0F1115; --ink2:#414854; --muted:#737B87; --faint:#A6ACB5;
    --line:#EBEBE8; --line2:#F2F2EF; --track:#EEEEEB;
    --accent:#2F5BEA; --accentSoft:#EEF2FE; --good:#12805C; --goodSoft:#E9F5EF; --warn:#B45309; --warnSoft:#FDF4E7; --bad:#C2410C; --badSoft:#FDEDE6;
    --sans:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0B0C0F; --surface:#121418; --hover:#181B20; --ink:#ECEEF2; --ink2:#C2C7D0; --muted:#8A919C; --faint:#5E6570;
      --line:#22252C; --line2:#1B1E24; --track:#22262D;
      --accent:#7D9BFF; --accentSoft:#1A2140; --good:#47C58F; --goodSoft:#10241B; --warn:#F2B25C; --warnSoft:#2A2012; --bad:#F38B69; --badSoft:#2C1812;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; letter-spacing: -.005em; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; letter-spacing: inherit; }
  button:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  button:disabled { opacity: .55; cursor: default; }
  svg { display: block; flex: none; }
  .page { max-width: 760px; margin: 0 auto; padding: 0 20px 48px; }

  /* Top */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 0 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14.5px; min-width: 0; }
  .mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; flex: none; }
  .brand span:last-child { color: var(--muted); font-weight: 500; white-space: nowrap; }
  .live { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 2.4s infinite; }
  .live.flash { color: var(--good); }
  .live.stale .pulse { background: var(--faint); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(18,128,92,.45); } 70% { box-shadow: 0 0 0 7px rgba(18,128,92,0); } 100% { box-shadow: 0 0 0 0 rgba(18,128,92,0); } }
  .quick { display: flex; gap: 6px; margin: 18px -20px 0; padding: 0 20px 2px; overflow-x: auto; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .qb { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; color: var(--ink2); white-space: nowrap; transition: border-color .12s; }
  .qb:hover { border-color: var(--ink2); color: var(--ink); }
  .qb svg { width: 15px; height: 15px; color: var(--muted); }
  .qb.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); margin-left: auto; }
  .qb.primary svg { color: var(--bg); }
  .count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--warnSoft); color: var(--warn); font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; }

  /* Status */
  .status { padding: 38px 0 28px; }
  .health { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--good); }
  .health i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .health.warn { color: var(--warn); }
  h1 { font-size: clamp(28px, 6vw, 38px); line-height: 1.12; letter-spacing: -.03em; font-weight: 600; margin: 10px 0 8px; }
  .meta { color: var(--muted); font-size: 15px; margin: 0; }
  .meta b { color: var(--ink2); font-weight: 500; }
  .prog { margin-top: 24px; }
  .bar { display: block; height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--ink); transition: width .6s ease; }
  .prog-l { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13.5px; color: var(--muted); }
  .prog-l b { color: var(--ink); font-weight: 600; }

  /* Sections */
  .sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 32px 0 10px; }
  .sec-h h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; white-space: nowrap; }
  .sec-h button, .sec-h span { font-size: 13px; color: var(--muted); font-weight: 500; text-align: right; }
  .sec-h button:hover { color: var(--ink); }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .box.need { border-color: color-mix(in srgb, var(--warn) 28%, var(--line)); }
  .wk-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
  .wk-col { padding: 16px 18px; border-right: 1px solid var(--line); min-width: 0; } .wk-col:last-child { border-right: 0; }
  .wk-col h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .wk-col ul { margin: 0; padding-left: 16px; font-size: 14px; line-height: 1.45; } .wk-col li + li { margin-top: 4px; }
  .wk-col.prob h4 { color: var(--warn); } .wk-col .ok { font-size: 14px; color: var(--good); }
  .wk-foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink2); }
  .wk-foot b { color: var(--ink); } .wk-foot .btn { height: 34px; font-size: 13px; padding: 0 14px; }
  .wk-empty { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; font-size: 14.5px; line-height: 1.5; color: var(--ink2); } .wk-empty .ic { flex: none; width: 20px; height: 20px; color: var(--accent); margin-top: 2px; }
  .prob-n { border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; background: color-mix(in srgb, var(--warn) 12%, transparent); } .prob-n h4 { margin: 0 0 4px; color: var(--warn); } .prob-n p { margin: 0; }
  .try-links { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 18px; }
  @media (max-width: 640px) { .wk-grid { grid-template-columns: 1fr; } .wk-col { border-right: 0; border-bottom: 1px solid var(--line); } .wk-col:last-child { border-bottom: 0; } }
  .need-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; font-weight: 600; font-size: 14.5px; }
  .more { display: block; width: 100%; padding: 12px 16px 14px; font-size: 13.5px; color: var(--muted); font-weight: 500; border-top: 1px solid var(--line2); }
  .more:hover { color: var(--ink); background: var(--hover); }

  /* Rows */
  .row { width: 100%; display: grid; grid-template-columns: 20px 1fr auto auto 14px; gap: 12px; align-items: center; padding: 13px 16px; transition: background .12s; }
  .row + .row { border-top: 1px solid var(--line2); }
  .row:hover { background: var(--hover); }
  .row-t { font-size: 14.5px; font-weight: 500; line-height: 1.35; min-width: 0; }
  .row-t small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .when { font-size: 13px; color: var(--muted); white-space: nowrap; text-align: right; }
  .when.soon, .m-when.soon { color: var(--ink2); font-weight: 500; } .when.late, .m-when.late { color: var(--bad); font-weight: 500; } .when.done { color: var(--faint); }
  .m-when { display: none; }
  .cc { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--accent); font-weight: 600; }
  .cc svg { width: 14px; height: 14px; }
  .chev { width: 14px; height: 14px; color: var(--faint); }
  .ic { width: 18px; height: 18px; }
  .kind { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: var(--warnSoft); color: var(--warn); }
  .kind svg { width: 12px; height: 12px; }
  .kind.soon, .kind.doc { background: var(--track); color: var(--ink2); } .kind.done { background: var(--goodSoft); color: var(--good); }

  /* Phase cards */
  .pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .pc { display: flex; flex-direction: column; gap: 4px; min-height: 132px; padding: 14px 15px 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; transition: border-color .15s, transform .15s, box-shadow .15s; }
  .pc:hover { border-color: var(--ink2); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.05); }
  .pc.now { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 3px var(--accentSoft); }
  .pc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pc-name { font-weight: 600; font-size: 15px; line-height: 1.3; margin-top: 2px; }
  .pc-d { font-size: 12.5px; color: var(--muted); }
  .pc-bot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .pc-bot b { color: var(--ink); font-weight: 600; }
  .pc-bot .cc { margin-left: auto; }
  .tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .tag.now { background: var(--accentSoft); color: var(--accent); } .tag.done { background: var(--goodSoft); color: var(--good); } .tag.next { color: var(--muted); padding: 0; font-weight: 500; }
  .tag.warn { background: var(--warnSoft); color: var(--warn); }
  .mring { width: 18px; height: 18px; transform: rotate(-90deg); }

  /* Updates */
  .up { width: 100%; display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 13px 16px; font-size: 14.5px; line-height: 1.5; }
  .up + .up { border-top: 1px solid var(--line2); }
  button.up:hover { background: var(--hover); }
  .up time { font-size: 13px; color: var(--muted); padding-top: 1px; }
  .up span { color: var(--ink2); }
  .up em { font-style: normal; font-weight: 600; color: var(--ink); }
  .up em.done { color: var(--good); }
  footer { margin-top: 30px; font-size: 12.5px; color: var(--faint); line-height: 1.7; }

  /* Panel */
  .scrim { position: fixed; inset: 0; background: rgba(10,12,16,.32); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .panel { position: fixed; top: 10px; right: 10px; bottom: 10px; width: min(540px, calc(100% - 20px)); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; z-index: 50; transform: translateX(calc(100% + 24px)); transition: transform .28s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; box-shadow: 0 24px 70px rgba(0,0,0,.18); overflow: hidden; }
  .panel.on { transform: none; }
  .p-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 12px 0 14px; flex: none; }
  .p-btn { height: 34px; min-width: 34px; padding: 0 10px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
  .p-btn:hover { background: var(--hover); color: var(--ink); }
  .p-btn svg { width: 16px; height: 16px; }
  .p-body { overflow-y: auto; padding: 8px 24px 40px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .p-eye { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .p-body h3 { font-size: 23px; line-height: 1.25; letter-spacing: -.02em; font-weight: 600; margin: 6px 0 18px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .props { margin: 0 0 22px; padding: 4px 0; border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2); }
  .props div { display: grid; grid-template-columns: 104px 1fr; gap: 12px; padding: 9px 0; font-size: 14px; align-items: center; }
  .props dt { color: var(--muted); }
  .props dd { margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .props .bar { flex: 1; min-width: 80px; max-width: 160px; height: 6px; }
  .props .bar i { background: var(--accent); }
  .blk { margin-bottom: 22px; }
  .blk h4, .cm h4 { margin: 0 0 7px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .blk p { margin: 0; color: var(--ink2); font-size: 14.5px; line-height: 1.65; }
  .ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .ul li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font-size: 14.5px; color: var(--ink2); line-height: 1.55; }
  .ul li::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); margin: 9px 0 0 4px; }
  .ol { counter-reset: n; list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .ol li { counter-increment: n; display: grid; grid-template-columns: 24px 1fr; gap: 10px; font-size: 14.5px; color: var(--ink2); line-height: 1.55; }
  .ol li::before { content: counter(n); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--track); color: var(--ink); font-size: 12px; font-weight: 600; margin-top: 1px; }
  .note { border-radius: 14px; padding: 14px 16px; margin-bottom: 22px; }
  .note h4 { margin: 0 0 7px; font-size: 13px; font-weight: 600; }
  .note p { margin: 0; font-size: 14px; color: var(--ink2); line-height: 1.6; }
  .note.warn { background: var(--warnSoft); } .note.warn h4 { color: var(--warn); } .note.warn .ul li::before { background: var(--warn); }
  .note.good { background: var(--goodSoft); } .note.good h4 { color: var(--good); }
  .note.info { background: var(--accentSoft); } .note.info h4 { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line); font-size: 13.5px; max-width: 100%; }
  .chip:hover { border-color: var(--ink2); }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .ic { width: 15px; height: 15px; }
  .p-list { margin: 0 -24px 22px; }
  .p-list .row, .p-list .up { padding-left: 24px; padding-right: 24px; }
  .p-sub { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
  .p-empty { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .person { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; margin-bottom: 18px; }
  .avatar { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 15px; }
  .person b { display: block; font-size: 15px; } .person span { color: var(--muted); font-size: 13.5px; }
  .rh { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line2); font-size: 14px; }
  .rh:first-child { border-top: 0; } .rh b { font-weight: 500; } .rh span { color: var(--ink2); }

  /* Comments */
  .cm { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
  .cm-note { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
  .cm-list { display: grid; gap: 10px; margin-bottom: 14px; }
  .msg { padding: 11px 13px; border-radius: 14px; background: var(--hover); max-width: 92%; justify-self: start; }
  .msg.me { background: var(--accentSoft); justify-self: end; }
  .msg-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  .msg-h b { color: var(--ink); font-weight: 600; font-size: 13px; }
  .msg p { margin: 0; font-size: 14.5px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
  .msg img { display: block; max-width: 100%; max-height: 240px; border-radius: 10px; margin-top: 8px; cursor: zoom-in; border: 1px solid var(--line); }
  .msg audio, .att audio { display: block; width: 100%; max-width: 300px; height: 40px; margin-top: 8px; }
  .ok-tag { background: var(--goodSoft); color: var(--good); font-weight: 600; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; }
  .cmp { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); transition: border-color .12s; }
  .cmp:focus-within, .cmp.drag { border-color: var(--ink2); }
  .cmp-name { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--line2); background: transparent; padding: 11px 13px; font: inherit; font-size: 14px; color: var(--ink); outline: none; }
  .cmp-text { display: block; width: 100%; min-height: 64px; border: 0; background: transparent; padding: 11px 13px; font: inherit; font-size: 14.5px; color: var(--ink); resize: vertical; outline: none; }
  .cmp-files { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px; }
  .cmp-files:not(:empty) { padding-bottom: 10px; }
  .att { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--hover); }
  .att img { display: block; height: 84px; max-width: 160px; object-fit: cover; }
  .att.audio { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; }
  .att.audio audio { margin: 0; width: 220px; }
  .att-a { position: absolute; inset: auto 4px 4px 4px; display: flex; justify-content: space-between; }
  .att-a button { height: 24px; padding: 0 8px; border-radius: 99px; background: rgba(15,17,21,.75); color: #fff; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; }
  .att.audio button { height: 24px; width: 24px; border-radius: 99px; background: var(--track); color: var(--ink2); display: inline-grid; place-items: center; }
  .att-a button svg, .att.audio button svg { width: 12px; height: 12px; }
  .cmp-bar { display: flex; align-items: center; gap: 4px; padding: 6px 8px 8px; border-top: 1px solid var(--line2); flex-wrap: wrap; }
  .cmp-b { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 99px; color: var(--ink2); font-size: 13.5px; font-weight: 500; cursor: pointer; }
  .cmp-b:hover { background: var(--hover); color: var(--ink); }
  .cmp-b svg { width: 16px; height: 16px; }
  .cmp-b.rec { background: var(--badSoft); color: var(--bad); }
  .cmp-b.rec b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .rdot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .cmp-b.ok { color: var(--good); } .cmp-b.ok.armed { background: var(--good); color: #fff; }
  .cmp-send { margin-left: auto; height: 34px; padding: 0 16px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 13.5px; font-weight: 600; }
  .ovl { position: fixed; inset: 0; z-index: 80; background: rgba(8,10,14,.82); display: grid; place-items: center; padding: 20px; }
  .ovl > img { max-width: 100%; max-height: 100%; border-radius: 10px; cursor: zoom-out; }
  .crop { background: var(--surface); border-radius: 18px; padding: 16px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 12px; }
  .crop p { margin: 0; font-size: 14px; color: var(--ink2); }
  .crop-area { position: relative; display: inline-block; line-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; align-self: center; }
  .crop-area img { max-width: min(86vw, 900px); max-height: 62vh; border-radius: 8px; pointer-events: none; }
  .crop-sel { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); border-radius: 4px; }
  .crop-bar { display: flex; justify-content: flex-end; gap: 8px; }
  .crop-bar button:first-child { height: 34px; padding: 0 14px; border-radius: 99px; color: var(--ink2); }
  .crop-bar .cmp-send { margin-left: 0; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 90; max-width: calc(100% - 32px); text-align: center; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* Sign + pay */
  .action { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 22px; background: var(--surface); }
  .action.todo { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: 0 0 0 3px var(--accentSoft); }
  .action.done { background: var(--goodSoft); border-color: transparent; }

function sigPng() {
  const cv = SIGN.cv; if (!cv) return null;

async function sendSignedDoc(docId) {

async function loadSigFile(file) {
  if (!file || !/^image\//.test(file.type)) return toast('Please choose an image file');
  const url = URL.createObjectURL(file);

    const img = await loadImg(url);

    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let i = 0; i < p.length; i += 4) {

}

/* ---------- Model ---------- */
const byId = (id) => B.tasks.find((t) => t.id === id);
const accessById = (id) => B.access.find((a) => a.id === id);
const docById = (id) => (B.documents || []).find((d) => d.id === id);
const qById = (id) => (B.questions || []).find((q) => q.id === id);
const qReplies = (key) => (FB.on ? thread(key).filter((m) => m.role === 'client' && m.kind !== 'due') : []);
const answeredAll = () => qReplies('q:all').length > 0;
const answeredOwn = (id) => qReplies(`q:${id}`).length > 0;
const answered = (id) => answeredOwn(id) || answeredAll();
const qDue = () => { const set = FB.on ? thread('q:all').filter((m) => m.role === 'client' && m.kind === 'due' && /^\d{4}-\d{2}-\d{2}$/.test(m.due || '')).pop() : null; return set ? set.due : ((B.questions || [])[0] || {}).due || null; };
const longDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const phaseOf = (id) => B.phases.find((p) => p.id === id) || { name: '', color: '#999' };
const who = (o) => (B.meta.owners || {})[o] || o;
const lead = () => ((B.contact && B.contact.name) || 'us').split(' ')[0];
const byDue = (a, b) => a.due.localeCompare(b.due);
const byBy = (a, b) => (a.by || '9999').localeCompare(b.by || '9999');
const needsOk = (t) => t.status !== 'done' && (t.info.need || []).some((n) => /approv|\bOK\b|\bgo\b|decision|agree/i.test(n));
const accessOk = (a) => !['received', 'not needed'].includes(a.status) && /\bOK\b|agree|approved/i.test(`${a.how} ${(a.howTo || []).join(' ')}`);

function state(t) {
  if (t.status === 'done') return { k: 'done', label: 'Done' };
  const team = TEAM.includes(t.owner);
  if (t.due < today) return { k: 'late', label: team ? 'Needed now' : 'Running late' };
  if (t.status === 'waiting') return { k: 'wait', label: 'Waiting' };
  if (team && t.start <= today) return { k: 'wait', label: t.owner === 'client' ? 'With your team' : `With ${who(t.owner)}` };
  if (t.status === 'doing' || t.start <= today) return { k: 'doing', label: 'In progress' };
  return { k: 'todo', label: 'Not started' };
}
function when(t) {
  if (t.status === 'done') return { text: t.doneOn ? `Done ${fmt(t.doneOn)}` : 'Done', cls: 'done' };
  const s = diff(today, t.start), d = diff(today, t.due);
  if (s > 0) return { text: s === 1 ? 'Starts tomorrow' : s < 7 ? `Starts ${dayName(t.start)}` : `Starts ${fmt(t.start)}`, cls: '' };
  if (d < 0) return { text: TEAM.includes(t.owner) ? `Was due ${fmt(t.due)}` : `${plural(-d, 'day')} late`, cls: 'late' };
  if (d === 0) return { text: 'Due today', cls: 'soon' };
  if (d === 1) return { text: 'Due tomorrow', cls: 'soon' };
  if (d < 7) return { text: `Due ${dayName(t.due)}`, cls: '' };
  return { text: `Due ${fmt(t.due)}`, cls: '' };
}
function byWhen(by) {
  if (!by) return { text: '', cls: '' };
  const d = diff(today, by);
  if (d < 0) return { text: `Was due ${fmt(by)}`, cls: 'late' };
  if (d === 0) return { text: 'Needed today', cls: 'soon' };
  if (d === 1) return { text: 'Needed tomorrow', cls: 'soon' };
  return { text: `By ${d < 7 ? dayName(by) : fmt(by)}`, cls: '' };
}
function icon(k, cls = 'ic') {
  const c = { done: 'var(--good)', doing: 'var(--accent)', wait: 'var(--warn)', late: 'var(--bad)', todo: 'var(--faint)' }[k];
  const ring = `<circle cx="10" cy="10" r="8" fill="none" stroke="${c}" stroke-width="1.8"/>`;
  const body = {
    done: `<circle cx="10" cy="10" r="9" fill="${c}"/><path d="M6 10.4l2.6 2.6L14 7.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`,
    doing: `${ring}<path d="M10 4.8a5.2 5.2 0 0 1 0 10.4z" fill="${c}"/>`,
    wait: `${ring}<path d="M10 6.2v4l2.5 1.6" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/>`,
    late: `${ring}<path d="M10 6v4.6" stroke="${c}" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="13.6" r="1.1" fill="${c}"/>`,

function compute() {
  today = todayStr();
  const M = B.meta;
  const tasks = B.tasks.filter((t) => t.status !== 'skipped');
  const done = tasks.filter((t) => t.status === 'done');
  const open = tasks.filter((t) => t.status !== 'done');
  const pct = tasks.length ? Math.round((done.length / tasks.length) * 100) : 0;
  const linked = new Set(B.access.flatMap((a) => a.tasks));
  const aItem = (a) => ({ kind: 'access', id: a.id, icon: 'key', title: a.item, sub: 'Access', by: a.by });
  const tItem = (t, sub, ic) => ({ kind: 'task', id: t.id, icon: ic, title: t.title, sub, by: t.due });
  const team = tasks.filter((t) => TEAM.includes(t.owner) && !linked.has(t.id));
  const inputs = open.filter((t) => t.owner === 'lead' && t.info.need.length && !linked.has(t.id));
  const fromTeam = (t) => (t.owner === 'client' ? 'From your team' : `From ${who(t.owner)}`);
  const needNow = [
    ...B.access.filter((a) => ['asked', 'waiting'].includes(a.status)).map(aItem),
    ...team.filter((t) => t.status !== 'done' && (t.start <= addDays(today, 3) || t.status === 'waiting')).map((t) => tItem(t, fromTeam(t), 'user')),
    ...inputs.filter((t) => t.status === 'waiting').map((t) => tItem(t, 'Your input', 'pen')),
  ].sort(byBy);
  const qOpen = (B.questions || []).filter((q) => !answered(q.id));
  if (qOpen.length) needNow.unshift({ kind: 'view', id: 'questions', icon: 'chat', title: B.questionsTitle || 'Questions for you', sub: `Your input · ${qOpen.length} to answer`, by: qDue() });
  const seen = new Set(needNow.map((n) => n.kind + n.id));
  const horizon = addDays(today, 21);
  const needSoon = [
    ...B.access.filter((a) => a.status === 'todo' && (!a.by || a.by <= horizon)).map(aItem),
    ...team.filter((t) => t.status !== 'done' && !seen.has('task' + t.id) && t.start <= horizon).map((t) => tItem(t, fromTeam(t), 'user')),
    ...inputs.filter((t) => !seen.has('task' + t.id) && t.start <= horizon).map((t) => tItem(t, 'Your input', 'pen')),
  ].sort(byBy);
  const needDone = [
    ...B.access.filter((a) => ['received', 'not needed'].includes(a.status)).map(aItem),
    ...team.filter((t) => t.status === 'done').map((t) => tItem(t, 'From your team', 'user')),
  ];
  const leadLate = open.filter((t) => t.owner === 'lead' && t.due < today);
  const teamLate = needNow.filter((n) => n.by && n.by < today);
  const launched = today >= M.launch;
  const health = launched ? { label: 'Live', tone: '' } : leadLate.length ? { label: 'Catching up', tone: 'warn' } : teamLate.length ? { label: 'Waiting on a few inputs', tone: 'warn' } : { label: 'On track', tone: '' };
  const feed = [
    ...B.updates.map((u) => ({ date: u.date, kind: 'update', text: u.text })),
    ...done.filter((t) => t.doneOn).map((t) => ({ date: t.doneOn, kind: 'done', id: t.id, text: t.title })),
    ...tasks.filter((t) => t.startedOn && t.status !== 'done').map((t) => ({ date: t.startedOn, kind: 'start', id: t.id, text: t.title })),
  ].sort((a, b) => b.date.localeCompare(a.date) || (a.kind === 'update' ? -1 : 1));
  const nextMs = (B.milestones || []).map(byId).filter(Boolean).find((t) => t.status !== 'done');
  return { qOpen, M, tasks, done, open, pct, needNow, needSoon, needDone, health, launched, feed, nextMs };
}

/* ---------- Panel views ---------- */
const ul = (a) => `<ul class="ul">${a.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
const chip = (t) => `<button class="chip" data-task="${t.id}">${icon(state(t).k)}<span>${esc(t.title)}</span></button>`;
function vTask(t) {

  const props = [['Status', `${icon(s.k)}${esc(s.label)}`], ['Owner', esc(who(t.owner))], ['Dates', `${t.start === t.due ? fmtW(t.due) : `${fmt(t.start)} → ${fmt(t.due)}`} <span style="color:var(--muted)">· ${w.text}</span>`]];
  if (t.progress && t.status !== 'done') props.push(['Progress', `<span class="bar"><i style="width:${(t.progress[0] / t.progress[1]) * 100}%"></i></span><span>${t.progress[0]} of ${t.progress[1]} steps</span>`]);
  if (t.status === 'done' && t.doneOn) props.push(['Completed', fmtL(t.doneOn)]);
  let h = `<div class="p-eye"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</div><h3>${esc(t.title)}</h3><dl class="props">${props.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  if (I.what) h += `<div class="blk"><h4>What this is</h4><p>${esc(I.what)}</p></div>`;
  if (I.why) h += `<div class="blk"><h4>Why it matters</h4><p>${esc(I.why)}</p></div>`;
  if (I.need.length && t.status !== 'done') h += `<div class="note warn"><h4>What we need from you</h4>${ul(I.need)}${acc.length ? `<div class="chips" style="margin-top:10px">${acc.map((a) => `<button class="chip" data-access="${a.id}">${svg('key', 'ic')}<span>${esc(a.item)}</span></button>`).join('')}</div>` : ''}</div>`;
  if (I.involves.length) h += `<div class="blk"><h4>What's involved</h4>${ul(I.involves)}</div>`;
  if (I.done) h += `<div class="note good"><h4>${t.status === 'done' ? 'Delivered' : 'Done when'}</h4><p>${esc(I.done)}</p></div>`;

  if (['needs', 'updates', 'docs', 'about', 'message', 'questions', 'weekly', 'try'].includes(type) && !id) return openPanel(type);
  if (type === 'week' && (B.weekly || []).some((w) => w.id === id)) return openPanel('week', id);
  if (type === 'build' && (B.builds || []).some((b) => b.id === id)) return openPanel('build', id);
  if (type === 'q' && id === 'all') return openAllAtOnce();
  if (type === 'q' && qById(id)) { openPanel('questions'); return openPanel('question', id, true); }
  if ((type === 'task' && byId(id)) || (type === 'doc' && docById(id)) || (type === 'access' && accessById(id))) return openPanel(type, id);
}
function render() {
  C = compute();
  document.title = `${C.M.project} · Project tracker`;
  const y = window.scrollY;
  $('#app').innerHTML = page(C);
  window.scrollTo(0, y);
  stamp();
  if (ui.stack.length) { if (composing()) paintThreads(); else drawPanel(true); }
}
function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return 'on ' + new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function stamp() {
  const el = $('#ago'); if (!el || !B) return;
  el.textContent = 'Updated ' + ago(B.generatedAt);
  $('#live').classList.toggle('stale', Date.now() - new Date(B.generatedAt) > 3 * 864e5);
}
let toastT = null;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200); }
async function load(first) {
  // On the local desk, the preview without a key switches to the keyed preview, so signing and comments work.
  if (first && !new URLSearchParams(location.hash.slice(1)).get('k') && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    try {
      const j = await (await fetch('/api/share', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })).json();
      const u = j.preview || j.url;
      if (u) { location.replace('/site/' + new URL(u).hash); return; }
    } catch {}
  }
  try {
    const d = await getData();
    // A newer version of this page has been published: reload once (an open tab otherwise keeps running old code),
    // unless something is being typed, recorded or signed. The ?v= makes the browser fetch the new page.
    if (d.pageVersion && /^[a-f0-9]{12}$/.test(PAGE_VERSION) && d.pageVersion !== PAGE_VERSION && !composing() && !SIGN.el) {
      let tried = null; try { tried = sessionStorage.getItem('tracker.reloaded'); } catch {}
      if (tried !== d.pageVersion) { try { sessionStorage.setItem('tracker.reloaded', d.pageVersion); } catch {} const u = new URL(location.href); u.searchParams.set('v', d.pageVersion); location.replace(u.toString()); return; }
    }
    const changed = first || d.generatedAt !== lastGen;
    if (changed) { B = d; lastGen = d.generatedAt; }
    if (first) { await fbInit(); render(); openFromLink(); if (await fbSync()) render(); return; }
    const added = await fbSync();
    if (changed || added) {
      render();
      if (changed) { const l = $('#live'); l.classList.add('flash'); setTimeout(() => l.classList.remove('flash'), 4000); }
    }
  } catch (e) {
    if (!first) return;
    const m = { 'no-key': ['This link is incomplete', 'Please open the full link you were sent, including everything after the # sign.'],
      'bad-key': ['This link has expired', 'Please ask for the current link.'],
      'not-ready': ['Almost ready', 'The tracker is being prepared. Please try again in a few minutes.'] }[e.message] || ['Could not load the tracker', 'Please refresh the page in a minute.'];
    $('#app').innerHTML = `<div class="msg-page"><h1>${m[0]}</h1><p>${m[1]}</p></div>`;
  }
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target;
  const sds = t.closest('[data-sdsend]'); if (sds) return sendSignedDoc(sds.dataset.sdsend);
  if (t.closest('[data-sdcancel]')) { SIGNDOC = null; return drawPanel(true); }
  const sa = t.closest('[data-s]'); if (sa && SIGN.el && SIGN.el.contains(sa)) return signAction(sa.dataset.s);
  const sg = t.closest('[data-sign]'); if (sg) return openSign(sg.dataset.sign);
  const sv = t.closest('[data-sign-view]'); if (sv) return openSign(sv.dataset.signView, true);
  const rd = t.closest('[data-read]'); if (rd) { openSign(rd.dataset.read, false); SIGN.step = 'view'; SIGN.png = null; return paintSign(); }
  const zoom = t.closest('[data-zoom]');
  if (zoom) { const ov = document.createElement('div'); ov.className = 'ovl'; ov.innerHTML = `<img src="${zoom.src}" alt="">`; ov.onclick = () => ov.remove(); document.body.appendChild(ov); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const key = act.dataset.key, i = Number(act.dataset.i);
    if (act.dataset.act === 'send') return sendMsg(key, 'comment');
    if (act.dataset.act === 'voice') return toggleVoice(key);
    if (act.dataset.act === 'crop') return openCrop(key, i);
    if (act.dataset.act === 'rm') { const f = draft(key).files.splice(i, 1)[0]; if (f) URL.revokeObjectURL(f.url); return paintComposer(key); }
    if (act.dataset.act === 'approve') {
      if (approveArm === key) return sendMsg(key, 'approval');
      approveArm = key; paintComposer(key);
      setTimeout(() => { if (approveArm === key) { approveArm = null; paintComposer(key); } }, 5000);
      return;
    }
  }
  if (t.closest('[data-close]') || t.id === 'scrim') return closePanel();
  if (t.closest('[data-back]')) { if (rec) return toast('Stop the voice note first'); ui.stack.pop(); approveArm = null; return drawPanel(false); }
  const inPanel = !!t.closest('#panel');
  const tk = t.closest('[data-task]'); if (tk) return openPanel('task', tk.dataset.task, inPanel);
  const ac = t.closest('[data-access]'); if (ac) return openPanel('access', ac.dataset.access, inPanel);
  const ph = t.closest('[data-phase]'); if (ph) return openPanel('phase', ph.dataset.phase, inPanel);
  const qdo = t.closest('[data-qdue-open]');
  if (qdo) {
    const box = qdo.parentNode, i = box.querySelector('[data-qdue]');
    try { if (typeof i.showPicker !== 'function') throw new Error('no picker'); i.showPicker(); }
    catch { box.classList.add('open'); i.classList.add('show'); i.focus(); }
    return;
  }
  const qa = t.closest('[data-qall]'); if (qa) { e.preventDefault(); return openAllAtOnce(); }
  const wk = t.closest('[data-week]'); if (wk) return openPanel('week', wk.dataset.week, inPanel);
  const bd = t.closest('[data-build]'); if (bd) return openPanel('build', bd.dataset.build, inPanel);
  const qq = t.closest('[data-q]'); if (qq) return openPanel('question', qq.dataset.q, inPanel);
  const dc = t.closest('[data-doc]'); if (dc) return openPanel('doc', dc.dataset.doc, inPanel);
  const vw = t.closest('[data-view]'); if (vw) return openPanel(vw.dataset.view, null, inPanel);
});
document.addEventListener('input', (e) => { const c = e.target.closest && e.target.closest('.cmp'); if (c && e.target.classList.contains('cmp-text')) draft(c.dataset.key).text = e.target.value; });
document.addEventListener('change', (e) => {
  if (e.target.dataset && e.target.dataset.signeddoc) {
    const files = [...e.target.files].filter((f) => f.type === 'application/pdf' || /^image\//.test(f.type));
    e.target.value = '';
    if (!files.length) return toast('Please choose a PDF or photos of the signed pages');
    SIGNDOC = { docId: e.target.dataset.signeddoc, files }; drawPanel(true); return;
  }
  if (e.target.dataset && 'qdue' in e.target.dataset) { setQDue(e.target.value, e.target); return; }
  if (e.target.id === 'sigfile') { loadSigFile(e.target.files[0]); e.target.value = ''; return; } if (e.target.dataset && e.target.dataset.pick) { addImages(e.target.dataset.pick, [...e.target.files]); e.target.value = ''; } });
document.addEventListener('paste', (e) => {
  const c = e.target.closest && e.target.closest('.cmp'); if (!c) return;
  const imgs = [...(e.clipboardData ? e.clipboardData.items : [])].filter((it) => it.kind === 'file' && it.type.startsWith('image/')).map((it) => it.getAsFile()).filter(Boolean);
  if (imgs.length) { e.preventDefault(); addImages(c.dataset.key, imgs); }
});
document.addEventListener('dragover', (e) => { const c = e.target.closest && e.target.closest('.cmp'); if (c) { e.preventDefault(); c.classList.add('drag'); } });
document.addEventListener('dragleave', (e) => { const c = e.target.closest && e.target.closest('.cmp'); if (c) c.classList.remove('drag'); });
document.addEventListener('drop', (e) => { const c = e.target.closest && e.target.closest('.cmp'); if (!c) return; e.preventDefault(); c.classList.remove('drag'); addImages(c.dataset.key, [...e.dataTransfer.files]); });
document.addEventListener('keydown', (e) => {
  const ov = document.querySelector('.ovl');
  if (e.key === 'Escape' && ov) { ov.remove(); return; }
  if (e.key === 'Escape' && SIGN.el) { closeSign(); return; }
  if (e.key === 'Escape' && ui.stack.length) closePanel();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { const c = e.target.closest && e.target.closest('.cmp'); if (c) sendMsg(c.dataset.key, 'comment'); }
});
window.addEventListener('hashchange', () => load(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
load(true);
setInterval(() => load(false), 60000);
setInterval(stamp, 30000);
